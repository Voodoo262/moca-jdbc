# Publishes the driver as GitHub Release assets. There are deliberately no Maven
# coordinates: the install path is "download the jar and point DBeaver at it", and a
# registry that needs credentials to read would get in the way of that.
name: Release

on:
  release:
    types: [ published ]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # upload release assets

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The tag is attacker-influenced text, so it goes through the environment rather
      # than being interpolated into the script.
      - name: Resolve the release version from the tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PREFIX='v'
          echo "RELEASE_VERSION=${RELEASE_TAG#"$PREFIX"}" >> "$GITHUB_ENV"

      # Without this a v1.0.1 tag would happily ship a jar stamped 1.0.0, and the
      # mismatch would only surface in someone's DBeaver connection panel.
      - name: Verify the tag matches the project version
        run: |
          set -euo pipefail
          BUILT="$(./gradlew -q printVersion)"
          if [ "$BUILT" != "$RELEASE_VERSION" ]; then
            echo "::error::tag says '$RELEASE_VERSION' but build.gradle says '$BUILT'"
            exit 1
          fi

      - run: ./gradlew build -PprojectVersion="$RELEASE_VERSION"

      - name: Verify the artifacts are all present
        run: |
          set -euo pipefail
          for suffix in '' '-sources' '-javadoc'; do
            jar="build/libs/moca-jdbc-${RELEASE_VERSION}${suffix}.jar"
            [ -f "$jar" ] || { echo "::error::missing $jar"; exit 1; }
            echo "ok: $jar"
          done

      - name: Attach the jars to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "build/libs/moca-jdbc-${RELEASE_VERSION}.jar" \
            "build/libs/moca-jdbc-${RELEASE_VERSION}-sources.jar" \
            "build/libs/moca-jdbc-${RELEASE_VERSION}-javadoc.jar" \
            --clobber
