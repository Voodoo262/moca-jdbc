# Publishes the driver as GitHub Release assets. There are deliberately no Maven
# coordinates: the install path is "download the jar and point DBeaver at it", and a
# registry that needs credentials to read would get in the way of that.
name: Release

on:
  release:
    types: [ published ]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # upload release assets

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The tag is the version: there is no literal in build.gradle to bump first. The
      # tag is also attacker-influenced text, so it goes through the environment rather
      # than being interpolated into the script.
      - name: Resolve the release version from the tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PREFIX='v'
          echo "RELEASE_VERSION=${RELEASE_TAG#"$PREFIX"}" >> "$GITHUB_ENV"

      # -PprojectVersion stamps the tag's version onto the jar names and the manifest's
      # Implementation-Version, which is what DBeaver's connection panel reports.
      - run: ./gradlew build -PprojectVersion="$RELEASE_VERSION"

      - name: Verify the artifacts are all present
        run: |
          set -euo pipefail
          for suffix in '' '-sources' '-javadoc'; do
            jar="build/libs/moca-jdbc-${RELEASE_VERSION}${suffix}.jar"
            [ -f "$jar" ] || { echo "::error::missing $jar"; exit 1; }
            echo "ok: $jar"
          done

      - name: Attach the jars to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "build/libs/moca-jdbc-${RELEASE_VERSION}.jar" \
            "build/libs/moca-jdbc-${RELEASE_VERSION}-sources.jar" \
            "build/libs/moca-jdbc-${RELEASE_VERSION}-javadoc.jar" \
            --clobber
