version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: [ "dependencies", "gradle" ]
    groups:
      gradle-minor-patch:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: [ "dependencies", "github-actions" ]
    groups:
      actions-all:
        patterns: [ "*" ]
